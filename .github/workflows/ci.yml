name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - preset: Debug-Application
            description: "Application Debug"
          - preset: Release-Application
            description: "Application Release"
          - preset: Debug-UnitTest
            description: "Unit Tests"

    name: Build ${{ matrix.description }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ cppcheck

      - name: Configure CMake (${{ matrix.description }})
        run: cmake --preset=${{ matrix.preset }}

      - name: Build (${{ matrix.description }})
        run: |
          if [ "${{ matrix.preset }}" = "Debug-Application" ]; then
            ninja -C build/Target/application/Debug
          elif [ "${{ matrix.preset }}" = "Release-Application" ]; then
            ninja -C build/Target/application/Release
          elif [ "${{ matrix.preset }}" = "Debug-UnitTest" ]; then
            ninja -C build/Target/application/unit_test
          fi

      - name: Run Unit Tests
        if: matrix.preset == 'Debug-UnitTest'
        run: |
          ctest --test-dir build/Target/application/unit_test \
                --output-on-failure -V

      - name: Run Cppcheck Static Analysis
        run: |
          cppcheck --enable=all \
                   --std=c11 \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=1 \
                   Core/Src/main.c \
                   Core/Src/freertos.c \
                   Core/Src/stm32l4xx_it.c \
                   Core/Src/stm32l4xx_hal_msp.c \
                   Core/Src/system_stm32l4xx.c \
                   TTA_Protocol/Master/*.c \
                   TTA_Protocol/Slave/*.c \
                   TTA_Protocol/Common/*.c

  status-check:
    name: Workflow Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Check workflow result
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build, tests, or static analysis failed!"
            exit 1
          fi
          echo "All checks passed! ✓"
